<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인터넷 차단 시연 웹앱</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      text-align: center;
    }
    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      border: none;
      margin-top: 10px;
    }
    .btn-toggle { background-color: #ff4d4d; color: white; }
    .btn-fetch { background-color: #4CAF50; color: white; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>웹앱 오프라인 모드 시연</h2>
    
    <!-- 인터넷 차단/해제 토글 버튼 -->
    <button id="toggle-offline-btn" class="btn-toggle">인터넷 잠시 차단하기</button>
    
    <hr style="margin: 20px 0;">

    <!-- 데이터 요청 테스트 버튼 -->
    <button id="fetch-data-btn" class="btn-fetch">서버에서 데이터 가져오기</button>
    
    <div id="status">상태: 온라인 (정상 작동 중)</div>
    <div id="result" style="margin-top: 10px; color: #555;"></div>
  </div>

  <script>
    // 1. 오프라인 모드 제어 스크립트 (가장 먼저 실행)
    let isSimulatedOffline = false;
    const originalFetch = window.fetch;

    // fetch 통신 가로채기
    window.fetch = async function(...args) {
      if (isSimulatedOffline) {
        throw new TypeError("Failed to fetch (Simulated Offline Mode)");
      }
      return originalFetch.apply(this, args);
    };

    // 토글 버튼 동작
    const toggleBtn = document.getElementById("toggle-offline-btn");
    const statusDiv = document.getElementById("status");

    toggleBtn.addEventListener("click", () => {
      isSimulatedOffline = !isSimulatedOffline;
      
      if (isSimulatedOffline) {
        toggleBtn.textContent = "인터넷 차단 해제하기";
        toggleBtn.style.backgroundColor = "#4CAF50";
        statusDiv.textContent = "상태: 🚫 오프라인 (인터넷 차단됨)";
        statusDiv.style.color = "red";
      } else {
        toggleBtn.textContent = "인터넷 잠시 차단하기";
        toggleBtn.style.backgroundColor = "#ff4d4d";
        statusDiv.textContent = "상태: 🌐 온라인 (정상 작동 중)";
        statusDiv.style.color = "green";
      }
    });

    // 2. 테스트용 데이터 요청 버튼 동작
    const fetchBtn = document.getElementById("fetch-data-btn");
    const resultDiv = document.getElementById("result");

    fetchBtn.addEventListener("click", async () => {
      resultDiv.textContent = "데이터 요청 중...";
      try {
        // 샘플 외부 API 호출
        const response = await fetch("https://jsonplaceholder.typicode.com/todos/1");
        const data = await response.json();
        resultDiv.textContent = `✅ 성공: ${data.title}`;
        resultDiv.style.color = "blue";
      } catch (error) {
        resultDiv.textContent = "❌ 실패: 인터넷 연결이 끊겼습니다 (또는 요청 차단됨)";
        resultDiv.style.color = "red";
      }
    });
  </script>
</body>
</html>
